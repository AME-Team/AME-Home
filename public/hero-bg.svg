<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1d" />
            <stop offset="50%" stop-color="#070a14" />
            <stop offset="100%" stop-color="#150b24" />
        </linearGradient>

        <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.1" />
            <stop offset="50%" stop-color="#7000ff" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2ff" stop-opacity="0" />
            <stop offset="30%" stop-color="#00f2ff" stop-opacity="0.8" />
            <stop offset="70%" stop-color="#7000ff" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7000ff" stop-opacity="0" />
            <stop offset="50%" stop-color="#ff007f" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#00f2ff" stop-opacity="0" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect width="1440" height="800" fill="url(#bgGrad)" />

    <g opacity="0.6">
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#gridGrad)" stroke-width="1" />
        </pattern>
        <rect width="1440" height="400" fill="url(#grid)" />
    </g>

    <g filter="url(#glow)">
        <path d="M -100 500 C 300 300, 500 700, 900 450 C 1200 280, 1300 600, 1640 400" 
              fill="none" stroke="url(#lineGrad1)" stroke-width="4" stroke-linecap="round" />

        <path d="M -100 420 C 200 600, 600 250, 1000 550 C 1250 700, 1400 400, 1640 480" 
              fill="none" stroke="url(#lineGrad2)" stroke-width="2" />

        <path d="M -100 460 C 250 450, 550 450, 950 500 C 1200 520, 1350 450, 1640 440" 
              fill="none" stroke="url(#lineGrad1)" stroke-width="1" opacity="0.5" />

        <path d="M -100 580 C 400 750, 800 400, 1200 650 C 1400 750, 1500 600, 1640 550" 
              fill="none" stroke="url(#lineGrad2)" stroke-width="1.5" opacity="0.7" />
    </g>

    <g fill="#00f2ff" opacity="0.6" filter="url(#glow)">
        <circle cx="380" cy="460" r="4" />
        <circle cx="560" cy="380" r="3" />
        <circle cx="820" cy="510" r="5" />
        <circle cx="1040" cy="480" r="3" />
        <circle cx="1210" cy="390" r="4" />
    </g>
    <g fill="#ff007f" opacity="0.5" filter="url(#glow)">
        <circle cx="210" cy="520" r="3" />
        <circle cx="710" cy="420" r="4" />
        <circle cx="930" cy="570" r="3" />
        <circle cx="1320" cy="530" r="4" />
    </g>
</svg>
